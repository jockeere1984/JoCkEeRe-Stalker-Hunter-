
 name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h

      - name: Fix permissions
        run: chmod -R 777 ${{ github.workspace }}

      - name: Create Dockerfile
        run: |
          cat > Dockerfile << 'EOF'
          FROM ubuntu:22.04
          ENV DEBIAN_FRONTEND=noninteractive
          ENV ANDROID_HOME=/opt/android-sdk
          ENV ANDROID_SDK_ROOT=/opt/android-sdk

          RUN apt-get update && apt-get install -y \
              python3 python3-pip git zip unzip \
              openjdk-17-jdk wget curl \
              autoconf libtool pkg-config \
              zlib1g-dev libncurses5-dev \
              libffi-dev libssl-dev \
              cmake build-essential aapt && \
              rm -rf /var/lib/apt/lists/*

          RUN mkdir -p /opt/android-sdk/cmdline-tools && \
              wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O /tmp/cmdtools.zip && \
              unzip -q /tmp/cmdtools.zip -d /opt/android-sdk/cmdline-tools && \
              mv /opt/android-sdk/cmdline-tools/cmdline-tools /opt/android-sdk/cmdline-tools/latest && \
              rm /tmp/cmdtools.zip

          ENV PATH="${ANDROID_HOME}/cmdline-tools/latest/bin:${ANDROID_HOME}/platform-tools:${ANDROID_HOME}/build-tools/33.0.2:${PATH}"

          RUN yes | sdkmanager --licenses 2>/dev/null || true
          RUN sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2" "ndk;25.2.9519653"

          RUN ls /opt/android-sdk/build-tools/33.0.2/aidl && echo "aidl OK"

          ENV ANDROID_NDK_HOME=/opt/android-sdk/ndk/25.2.9519653

          RUN pip3 install --upgrade pip && \
              pip3 install cython==0.29.37 buildozer==1.5.0

          RUN useradd -m -u 1000 builder && \
              chown -R builder:builder /opt/android-sdk

          USER builder
          WORKDIR /app
          EOF

      - name: Build Docker image
        run: docker build -t jockeere-builder .

      - name: Build APK
        run: |
          docker run --rm \
            -v "${{ github.workspace }}":/app \
            --user 1000:1000 \
            jockeere-builder \
            buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JoCkEeRe-APK
          path: bin/*.apk
          retention-days: 7
