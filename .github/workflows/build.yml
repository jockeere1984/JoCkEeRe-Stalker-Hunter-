
name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          df -h

      - name: Pull kivy/buildozer Docker image
        run: docker pull kivy/buildozer

      - name: Build APK with Docker
        run: |
          docker run --rm \
            -v "${{ github.workspace }}":/home/user/hostcwd \
            kivy/buildozer \
            bash -c "
              cd /home/user/hostcwd &&
              pip install --upgrade buildozer cython==0.29.37 &&
              buildozer -v android debug
            "

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JoCkEeRe-APK
          path: bin/*.apk
          retention-days: 7
