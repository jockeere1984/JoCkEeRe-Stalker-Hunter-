name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev \
            libffi-dev libssl-dev \
            cmake build-essential \
            libltdl-dev patchelf ant

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "cython>=3.0.0,<4"
          pip install buildozer==1.5.0
          pip install "python-for-android==2023.9.16"

      - name: Setup Android SDK
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip \
               -O /tmp/cmdtools.zip
          unzip -q /tmp/cmdtools.zip -d $HOME/android-sdk/cmdline-tools
          mv $HOME/android-sdk/cmdline-tools/cmdline-tools \
             $HOME/android-sdk/cmdline-tools/latest

          export ANDROID_HOME=$HOME/android-sdk
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH

          yes | sdkmanager --licenses 2>/dev/null || true
          sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2"

          # Install NDK
          wget -q https://dl.google.com/android/repository/android-ndk-r25b-linux.zip \
               -O /tmp/ndk.zip
          unzip -q /tmp/ndk.zip -d $HOME/android-sdk/
          mv $HOME/android-sdk/android-ndk-r25b $HOME/android-sdk/ndk
          mkdir -p $HOME/android-sdk/ndk
          mv $HOME/android-sdk/android-ndk-r25b $HOME/android-sdk/ndk/25.2.9519653 2>/dev/null || true

          # Compat symlinks for buildozer
          mkdir -p $HOME/android-sdk/tools/bin
          ln -sf $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager \
                 $HOME/android-sdk/tools/bin/sdkmanager
          ln -sf $HOME/android-sdk/cmdline-tools/latest/bin/avdmanager \
                 $HOME/android-sdk/tools/bin/avdmanager

          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$HOME/android-sdk/ndk/25.2.9519653" >> $GITHUB_ENV

      - name: Patch buildozer.spec paths
        run: |
          sed -i "s|android.sdk_path = .*|android.sdk_path = $HOME/android-sdk|g" buildozer.spec
          sed -i "s|android.ndk_path = .*|android.ndk_path = $HOME/android-sdk/ndk/25.2.9519653|g" buildozer.spec
          cat buildozer.spec

      - name: Build APK
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          export ANDROID_SDK_ROOT=$HOME/android-sdk
          export ANDROID_NDK_HOME=$HOME/android-sdk/ndk/25.2.9519653
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/build-tools/33.0.2:$PATH
          python -m buildozer -v android debug 2>&1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JoCkEeRe-APK
          path: bin/*.apk
          retention-days: 7
