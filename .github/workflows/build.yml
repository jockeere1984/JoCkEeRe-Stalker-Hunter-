
name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libffi-dev libssl-dev cmake build-essential

      - name: Install Python deps
        run: |
          pip install --upgrade pip
          pip install cython==0.29.37 buildozer==1.5.0

      - name: Setup Android SDK in buildozer path
        run: |
          BSDK=$HOME/.buildozer/android/platform/android-sdk
          SYSTEM_SDK=/usr/local/lib/android/sdk
          mkdir -p $BSDK/tools/bin
          mkdir -p $BSDK/build-tools
          mkdir -p $BSDK/platforms
          mkdir -p $BSDK/platform-tools
          yes | $SYSTEM_SDK/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $SYSTEM_SDK/cmdline-tools/latest/bin/sdkmanager "build-tools;33.0.2" "platforms;android-33" "platform-tools"
          ln -sf $SYSTEM_SDK/build-tools/33.0.2 $BSDK/build-tools/33.0.2
          ln -sf $SYSTEM_SDK/platforms/android-33 $BSDK/platforms/android-33
          ln -sf $SYSTEM_SDK/platform-tools/adb $BSDK/platform-tools/adb
          printf '#!/bin/bash\nexec /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "$@"\n' > $BSDK/tools/bin/sdkmanager
          chmod +x $BSDK/tools/bin/sdkmanager
          printf '#!/bin/bash\necho "Android SDK tool wrapper"\n' > $BSDK/tools/bin/android
          chmod +x $BSDK/tools/bin/android

      - name: Setup NDK in buildozer path
        run: |
          ln -sf /usr/local/lib/android/sdk/ndk/25.2.9519653 $HOME/.buildozer/android/platform/android-ndk-r25b

      - name: Build APK
        run: buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JoCkEeRe-APK
          path: bin/*.apk
          retention-days: 7
