
name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libffi-dev libssl-dev cmake build-essential

      - name: Accept licenses and install SDK
        run: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "build-tools;33.0.2" "platforms;android-33" "platform-tools" "ndk;25.2.9519653"

      - name: Install Python deps
        run: |
          pip install --upgrade pip
          pip install cython==0.29.37 buildozer==1.5.0

      - name: Setup buildozer SDK paths
        run: |
          BSDK=$HOME/.buildozer/android/platform/android-sdk
          mkdir -p $BSDK/build-tools
          mkdir -p $BSDK/platforms
          mkdir -p $BSDK/ndk
          mkdir -p $BSDK/tools/bin

          ln -sf $ANDROID_SDK_ROOT/build-tools/33.0.2 $BSDK/build-tools/33.0.2
          ln -sf $ANDROID_SDK_ROOT/platforms/android-33 $BSDK/platforms/android-33
          ln -sf $ANDROID_SDK_ROOT/platform-tools $BSDK/platform-tools
          ln -sf $ANDROID_SDK_ROOT/ndk/25.2.9519653 $BSDK/ndk/25.2.9519653
          ln -sf $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager $BSDK/tools/bin/sdkmanager

      - name: Build APK
        run: |
          export ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/25.2.9519653
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JoCkEeRe-APK
          path: bin/*.apk
          retention-days: 7
