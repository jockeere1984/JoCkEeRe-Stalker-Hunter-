
name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libffi-dev libssl-dev cmake build-essential

      - name: Install Python deps
        run: |
          pip install --upgrade pip
          pip install cython==0.29.37 buildozer==1.5.0

      - name: Prepare SDK layout for buildozer
        run: |
          SYS=/usr/local/lib/android/sdk
          BSDK=$HOME/.buildozer/android/platform/android-sdk
          BNDK=$HOME/.buildozer/android/platform/android-ndk-r25b

          yes | $SYS/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $SYS/cmdline-tools/latest/bin/sdkmanager "build-tools;33.0.2" "platforms;android-33" "platform-tools"

          mkdir -p $BSDK/tools/bin
          mkdir -p $BSDK/cmdline-tools/latest/bin
          mkdir -p $BSDK/build-tools
          mkdir -p $BSDK/platforms
          mkdir -p $BSDK/platform-tools

          ln -sfn $SYS/build-tools/33.0.2  $BSDK/build-tools/33.0.2
          ln -sfn $SYS/platforms/android-33 $BSDK/platforms/android-33
          ln -sfn $SYS/platform-tools       $BSDK/platform-tools

          printf '#!/bin/bash\nexec /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "$@"\n' > $BSDK/tools/bin/sdkmanager
          chmod +x $BSDK/tools/bin/sdkmanager
          cp $BSDK/tools/bin/sdkmanager $BSDK/cmdline-tools/latest/bin/sdkmanager

          printf '#!/bin/bash\necho ok\n' > $BSDK/tools/bin/android
          chmod +x $BSDK/tools/bin/android

          ln -sfn $SYS/ndk/27.3.13750724 $BNDK

      - name: Build APK
        run: |
          export ANDROIDSDK=$HOME/.buildozer/android/platform/android-sdk
          export ANDROIDNDK=$HOME/.buildozer/android/platform/android-ndk-r25b
          export ANDROIDAPI=33
          export ANDROIDMINAPI=21
          export ANDROID_HOME=$ANDROIDSDK
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JoCkEeRe-APK
          path: bin/*.apk
          retention-days: 7
